apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
spec:
  parentRefs:
    - name: gateway-prd
      kind: Gateway
      namespace: traefik
  hostnames:
    - podinfo.api.sarabi.live
  rules:
    - backendRefs:
        - name: podinfo
          kind: Service
          port: 9898
